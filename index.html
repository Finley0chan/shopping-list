<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping List</title>
<style>
body{font-family:Arial;background:#f0fdf4;padding:25px}
main{max-width:550px;margin:auto;background:white;padding:25px;border-radius:15px}
input[type=text]{padding:13px;width:65%;box-sizing:border-box;border:1px solid #86efac;border-radius:6px}
button{background:#15803d;color:white;border:0;padding:12px;border-radius:6px;cursor:pointer}
.item{display:flex;align-items:center;gap:10px;background:#dcfce7;padding:15px;margin-top:12px;border-radius:8px}
.item span{flex:1;overflow-wrap:anywhere}
.done{text-decoration:line-through;color:gray}
</style>
</head>
<body>
<main>
<h1>Shopping List</h1>
<p>Plan your shopping efficiently.</p>
<input type="text" id="product" placeholder="Enter product name">
<button onclick="addItem()">Add Item</button>
<p id="summary"></p>
<div id="items"></div>
</main>
<script>
let items=JSON.parse(localStorage.getItem("shoppingItems")||"[]");
function save(){
 localStorage.setItem("shoppingItems",JSON.stringify(items));
 render();
}
function addItem(){
 const input=document.getElementById("product");
 if(!input.value.trim()) return;
 items.push({name:input.value.trim(),done:false});
 input.value="";
 save();
}
function render(){
 const list=document.getElementById("items");
 list.innerHTML="";
 items.forEach((item,i)=>{
  const row=document.createElement("div");
  row.className="item";
  const check=document.createElement("input");
  check.type="checkbox";
  check.checked=item.done;
  check.onchange=()=>{
   items[i].done=check.checked;
   save();
  };
  const name=document.createElement("span");
  name.textContent=item.name;
  if(item.done) name.className="done";
  const del=document.createElement("button");
  del.textContent="Delete";
  del.onclick=()=>{
   items.splice(i,1);
   save();
  };
  row.append(check,name,del);
  list.appendChild(row);
 });
 document.getElementById("summary").textContent=
 items.filter(i=>i.done).length+" of "+items.length+" items purchased";
}
render();
</script>
</body>
</html>
